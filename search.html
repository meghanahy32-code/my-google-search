<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Search Results</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background-color: #fff; color: #202124; }
    
    header {
      display: flex;
      align-items: center;
      padding: 20px 30px;
      border-bottom: 1px solid #ebebeb;
      gap: 20px;
    }
    .logo { font-size: 30px; font-weight: bold; text-decoration: none; }
    .logo span:nth-child(1) { color: #4285F4; }
    .logo span:nth-child(2) { color: #EA4335; }
    .logo span:nth-child(3) { color: #FBBC05; }
    .logo span:nth-child(4) { color: #4285F4; }
    .logo span:nth-child(5) { color: #34A853; }
    .logo span:nth-child(6) { color: #EA4335; }

    .search-box-wrapper {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 600px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      padding: 10px 20px;
      box-shadow: 0 1px 6px rgba(32,33,36,0.18);
    }
    .search-input { width: 100%; border: none; outline: none; font-size: 16px; }

    .results-container { margin: 30px 150px; max-width: 650px; }
    .result-item { margin-bottom: 30px; }
    .result-url { font-size: 14px; color: #202124; margin-bottom: 4px; }
    .result-title { font-size: 20px; color: #1a0dab; text-decoration: none; display: block; margin-bottom: 5px; }
    .result-title:hover { text-decoration: underline; }
    .result-snippet { font-size: 14px; color: #4d5156; line-height: 1.58; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </a>
    <div class="search-box-wrapper">
      <input type="text" class="search-input" id="search-term">
    </div>
  </header>

  <main class="results-container">
    <p id="search-info" style="color: #70757a; font-size: 14px; margin-bottom: 20px;"></p>

    <!-- Custom Search Results -->
    <div class="result-item">
      <div class="result-url">https://example.com › search</div>
      <a href="#" class="result-title" id="res-title-1">Search Result Title</a>
      <p class="result-snippet">This is a custom search result generated by your own Google Clone project!</p>
    </div>

    <div class="result-item">
      <div class="result-url">https://wikipedia.org › wiki</div>
      <a href="#" class="result-title" id="res-title-2">Information Page</a>
      <p class="result-snippet">Explore comprehensive information and details regarding your query here.</p>
    </div>
  </main>

  <script>
    // URL ನಿಂದ ಹುಡುಕಿದ ಶಬ್ದವನ್ನು ಪಡೆಯುವುದು
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q') || 'Google Clone';

    document.getElementById('search-term').value = query;
    document.getElementById('search-info').textContent = `About 1,240,000 results for "${query}"`;
    document.getElementById('res-title-1').textContent = `${query} - Official Site`;
    document.getElementById('res-title-2').textContent = `All about ${query}`;
  </script>

</body>
</html>
